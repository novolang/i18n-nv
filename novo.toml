[package]
name        = "i18n-nv"
version     = "0.0.2"
description = "Project Fluent for novo-lang: FTL text parsed into a typed resource with messages, attributes, placeables and selectors; the CLDR plural categories with the shipped locales' rules as data; a bundle that resolves a message id and arguments into a caller's buffer; fallback chains across locales; and bidi isolation on by default.  Resolution NEVER FAILS — it answers the text it managed and the list of errors beside it, because a localisation bug ships at 3am in a locale nobody on the team reads.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`.  FTL text arrives as a `Str` the host read; a bundle holds
# parsed resources and nothing else; the clock a date placeable
# formats against is a `CivilDateTime` the caller passes in.  Nothing
# here reads a file, consults a locale from the environment, or asks
# what time it is — all three are the host's, and all three are what
# makes a localised string untestable when a library does them itself.
layer       = "core"

category    = "text"

tags        = ["i18n", "l10n", "fluent", "ftl", "plural", "cldr", "gettext", "translation", "sans-io"]
repository  = "https://github.com/novolang/i18n-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A resolution that cannot fail, and a plural category that depends on the formatting"

[dependencies]
# numfmt-nv, for the NUMBER placeable — and for something less obvious
# that the plural rules need.
#
# A CLDR plural category is NOT a function of a number's value.  It is
# a function of the number's DECIMAL REPRESENTATION: the operands the
# specification names `v` and `f` are the count and the value of the
# visible fraction digits, so `1` is `one` in English and `1.0` is
# `other`.  That means the formatter and the selector have to agree,
# and the only way to make them agree is for the same formatting to
# produce both — which is `i18nfmt.operands_of`, over numfmt-nv's
# digits.
numfmt-nv = "^0.1.1"

# calendar-nv, for the DATE placeable.
#
# `CivilDateTime` is the type a date argument arrives as, and it is
# calendar-nv's rather than one of this package's because a caller
# that already holds a date should not convert it to pass it, and
# because the arithmetic a relative-time formatter needs — days
# between, months between — is already there and correct.
#
# No clock, on purpose: `calendar-nv` has none either, and a
# localisation whose output depends on when the test ran is a
# localisation nobody can assert against.
calendar-nv = "^0.0.2"
